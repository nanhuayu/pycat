[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pycat"
description = "Unified agent workbench for terminal, desktop, web and channels"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dynamic = ["version", "dependencies", "optional-dependencies"]

[project.scripts]
pycat = "pycat.__main__:main"

[project.gui-scripts]
pycat-gui = "pycat.gui.application:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pycat*"]
exclude = ["tests*", "docs*", "scripts*", "temp*", "build*", "release*"]

[tool.setuptools.package-data]
"pycat" = ["py.typed", "assets/**/*", "assets/*.ico"]
"pycat.tui" = ["*.tcss"]

# Native helpers are copied explicitly by the Windows standalone build. Keep
# the platform-independent SDK wheel free of developer-prepared executables.
[tool.setuptools.exclude-package-data]
"pycat" = ["assets/tools/ripgrep/windows-x64/*"]

# Dependencies are single-sourced from requirements.txt / requirements-dev.txt.
[tool.setuptools.dynamic]
version = { attr = "pycat.core.version.__version__" }
dependencies = { file = ["requirements.txt"] }
optional-dependencies = { dev = { file = ["requirements-dev.txt"] }, gui = { file = ["requirements-gui.txt"] }, ocr = { file = ["requirements-ocr.txt"] }, tui = { file = ["requirements-tui.txt"] }, web = { file = ["requirements-web.txt"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["temp", "build", "release", "assets", ".git"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
