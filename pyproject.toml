[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pycat"
description = "PyQt6 desktop LLM agent workbench with CLI and channel integrations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dynamic = ["version", "dependencies", "optional-dependencies"]

[project.scripts]
pycat = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "gui*", "cli*", "models*"]
exclude = ["tests*", "docs*", "scripts*", "temp*", "build*", "release*"]

[tool.setuptools.package-data]
"core.app" = ["default_models.json"]

# Dependencies are single-sourced from requirements.txt / requirements-dev.txt.
[tool.setuptools.dynamic]
version = { attr = "core.version.__version__" }
dependencies = { file = ["requirements.txt"] }
optional-dependencies = { dev = { file = ["requirements-dev.txt"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["temp", "build", "release", "assets", ".git"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
